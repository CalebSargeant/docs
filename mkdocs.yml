# docs.calebsargeant.com: MkDocs Material.
#
# Replaces the Sphinx + Read the Docs build that served this corpus until 2026. The
# pages are Markdown under docs/, the theme is Material, and the site is published by
# MagmaMoose/tremvok's `cloudflare-docs` target as an assets-only Cloudflare Worker
# (see .github/workflows/docs.yml and wrangler.toml). The same deploy writes llms.txt,
# llms-full.txt and the search corpus mcp.calebsargeant.com reads.
#
# This repo deliberately does NOT `INHERIT: mkdocs.base.yml`. That base belongs to the
# MagmaMoose fleet and pins site_url to docs.magmamoose.com/<repo>/, which is not where
# these pages live. Owning the whole file here means `markdown_extensions` and `plugins`
# below are the complete list rather than a partial override — MkDocs REPLACES lists
# instead of merging them, so a half-list under INHERIT silently drops the rest.

site_name: Caleb Sargeant's Docs
site_description: Technical how-to guides, runbooks and study notes on networking, cloud, Linux and automation.
site_author: Caleb Sargeant

# Canonical address, and the base for <link rel="canonical">, the sitemap, the Open Graph
# URLs (hooks/seo.py) and every citation in the search corpus: tremvok builds the corpus
# URLs from this line, so a wrong value here is a wrong link in every answer an agent
# gives. It must be the address the Worker route in wrangler.toml serves.
site_url: https://docs.calebsargeant.com/

repo_url: https://github.com/CalebSargeant/docs
repo_name: CalebSargeant/docs
edit_uri: edit/master/docs/

copyright: Caleb Sargeant

theme:
  name: material
  language: en
  # overrides/main.html adds the Open Graph tags and JSON-LD that hooks/seo.py computes.
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  # The portrait, face-cropped, as the tab icon and the header logo: the same icons
  # calebsargeant.com uses, so both sites read as one person. Copied from that repo's
  # assets/ (favicon-32.png, icon-192.png, apple-touch-icon.png and favicon.ico), where
  # scripts/render_images.py generates them. Re-copy them if the photo ever changes.
  # overrides/main.html links the 192px and touch icons; docs/favicon.ico answers the
  # /favicon.ico request browsers and crawlers make without reading any HTML.
  favicon: assets/images/portrait-32.png
  logo: assets/images/portrait-192.png
  # The house faces from calebsargeant.com: Space Grotesk for display, JetBrains Mono
  # for code. docs/assets/theme.css carries the rest of that design system across.
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    # Dark first, because the site this borrows from declares `color-scheme: dark`
    # and the reader should not be flashed a white page on the way to it.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    # A section's own index.rst became its index.md; this makes that page the section
    # landing page rather than a stray first child.
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/theme.css

# The corpus carries five `.. math::` blocks; arithmatex renders them and MathJax is
# what it hands them to.
extra_javascript:
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# Per-page meta descriptions, Open Graph and JSON-LD, and a security.txt whose Expires
# moves forward with every deploy. A hook rather than a plugin: nothing to install, and
# nothing extra in docs/requirements.txt. The file says why each one exists.
hooks:
  - hooks/seo.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - mdx_truly_sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  # Material's own icon set, which is what `:material-lan:` on the landing page
  # resolves through. Without it that text renders literally.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  # custom_fences is what turns a ```mermaid block into a diagram. Without it
  # superfences renders the diagram source as a code listing: no error, no warning.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Kept in the repository, kept out of the published site. `/conf.py` is the Sphinx
# configuration from before the move to MkDocs: nothing reads it, and it had been
# published as https://docs.calebsargeant.com/conf.py.
#
# The lab archives, course PDFs and GNS3 projects behind the old `:download:` role come
# to about 700 MB and include single files of 84 MB. Cloudflare Workers refuses a static
# asset over 25 MiB and GitHub Pages caps a published site at 1 GB, so shipping them
# would fail the deploy outright. They still live in git, and every download link now
# points at raw.githubusercontent.com, so nothing is lost but the bytes on the CDN.
exclude_docs: |
  **/_docs/
  **/_files/
  *.gns3project
  *.drawio
  .DS_Store
  requirements.txt
  /conf.py

extra:
  # Read by tremvok's agent-ready step (v2.12.0 and later), which writes the site's Agent
  # Skills index and skill, loads WebMCP tools on every page and writes /auth.md. The MCP
  # server is the one setting worth giving it: the skill then sends an agent to the server
  # that searches these pages and calebsargeant.com, instead of having it scrape.
  agents:
    mcp: https://mcp.calebsargeant.com/
  social:
    - icon: fontawesome/solid/globe
      link: https://calebsargeant.com/
      name: calebsargeant.com
    - icon: fontawesome/brands/github
      link: https://github.com/CalebSargeant
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/calebsargeant
      name: LinkedIn
  # Read by tremvok's agent-readiness step (the release after v2.10.2, see docs.yml). The
  # site's skill names this MCP server beside llms.txt and the markdown copies, and auth.md
  # points at the server's own OAuth metadata for its access rather than restating it. The
  # same server hooks/seo.py's AI and API catalogs name. MkDocs itself ignores the block.
  agents:
    mcp: https://mcp.calebsargeant.com/

