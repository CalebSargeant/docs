# Build the MkDocs site and publish it to docs.calebsargeant.com on Cloudflare Workers.
#
# MagmaMoose/tremvok's `cloudflare-docs` target does all of it, in this order:
#
#   1. installs the pinned toolchain from docs/requirements.txt and builds with `--strict`,
#      so a broken internal link or a nav entry naming a missing page fails here rather
#      than publishing a site with holes in it;
#   2. gives each page its own metadata and markdown copy, except that hooks/seo.py has
#      already done both during the build, so this step finds them and adds nothing;
#   3. writes llms.txt and llms-full.txt into the built site, and the search corpus
#      (index/docs.json) beside it, in one pass over the markdown just rendered;
#   4. from the release after v2.10.2 (see the pin below): an Agent Skills index, WebMCP
#      tools on every page and an auth.md, written into the built site;
#   5. deploys ./site as the assets-only Worker described in wrangler.toml;
#   6. only after the deploy succeeded, publishes index/docs.json to the R2 bucket that
#      mcp.calebsargeant.com reads, so an agent never cites a page that failed to deploy.
#
# This is how the MagmaMoose fleet's docs reach mcp.magmamoose.com, and why this repo left
# `target: github-pages`: Pages can host the site but not publish the corpus, and it cannot
# set a single response header, so it could never carry the CSP and HSTS in docs/_headers.
#
# A PULL REQUEST PUBLISHES NOTHING: tremvok resolves it to `mode: preview`, which builds,
# checks and generates the corpus without deploying or uploading. The strict build is the
# check, and a preview can never overwrite the shared corpus with an unmerged branch.
#
# ONE SECRET, CLOUDFLARE_API_TOKEN: an account token for the Magma Moose account (where the
# calebsargeant.com zone lives) with Workers Scripts: Edit, Workers Routes: Edit on
# calebsargeant.com, and Workers R2 Storage: Edit for the corpus. Cloudflare's "Edit
# Cloudflare Workers" template carries all three, so the token CalebSargeant/website deploys
# with is the right one. Without it the deploy fails loudly on master and GitHub Pages keeps
# serving; pull requests (Dependabot's included) need no secret at all.
name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'mkdocs.yml'
      - 'wrangler.toml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'mkdocs.yml'
      - 'wrangler.toml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: a half-finished deploy is worse than a slow one.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, with the tag in the comment; Dependabot moves both together.
      # v2.8.0 brought tremvok#48: credentials are required only where something publishes,
      # so a pull request without secrets builds and passes instead of failing on a token.
      # v2.10.2 adds #49, which indexes only the pages the build emitted (the excluded
      # other/general/_docs/README.md stops being cited at a URL that 404s), and #52's
      # page-metadata step. That step finds hooks/seo.py's descriptions, Open Graph, JSON-LD
      # and markdown copies on every page and leaves them alone, and llms.txt now links the
      # copies.
      #
      # WAITING FOR THE NEXT RELEASE. The one after v2.10.2 carries tremvok#56: an Agent Skills
      # index, WebMCP tools on every page and an auth.md, written into the site by a step
      # after this build. `extra.agents` in mkdocs.yml and the agent-skills rule in
      # docs/_headers are for it, and inert until the pin moves.
      - uses: MagmaMoose/tremvok@0063b5cfba963da846779a7b1ea0e0a81295a91f # v2.10.2
        with:
          target: cloudflare-docs
          pages-strict: true
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The id wrangler.toml pins. Not a credential: it is in every dashboard URL.
          cloudflare-account-id: 6e26afa31c37dee1dc82ad2f214f9b3c
          cloudflare-wrangler-version: '4.135.0'
          # The corpus. index/docs.json is written from the repository's own visibility,
          # which tremvok reads from GitHub and treats as private unless it is `public`.
          cloudflare-docs-index-bucket: calebsargeant-docs-index
          # This repository is a corpus, not a house tool: it declares no capabilities.
          cloudflare-docs-capability-file: ''
          # No `cloudflare-docs-host`: that input describes a site mounted at
          # <host>/<repo>/ behind the MagmaMoose docs router, and would make every citation
          # https://docs.calebsargeant.com/docs/... Left empty, the corpus is cited from
          # `site_url` in mkdocs.yml, which is the address this Worker actually serves.
