# Build the MkDocs site and publish it to GitHub Pages.
#
# The build is MagmaMoose/tremvok's `github-pages` target: it installs the pinned
# toolchain from docs/requirements.txt, runs the repo-shape checks, and builds with
# `--strict`, so a broken internal link or a nav entry naming a missing page fails here
# rather than publishing a site with holes in it.
#
# TWO JOBS, and the split is not a preference. `actions/deploy-pages` requires
# `pages: write` and the `github-pages` environment, and a composite action can declare
# neither, so tremvok builds and stages the artifact and the job below publishes it.
# The environment name is fixed: GitHub creates `github-pages` when Pages' source is set
# to "GitHub Actions", and deploy-pages expects exactly that name.
#
# A PULL REQUEST PUBLISHES NOTHING. Pages has one site and no preview destination, so
# publishing to it is publishing. tremvok resolves a pull request to `mode: preview`,
# which builds and checks without staging an artifact. The strict build is the check.
#
# Before the first run: Settings -> Pages -> Source = "GitHub Actions". Once.
name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: a half-finished Pages deploy is worse than a slow
# one, and `cancel-in-progress` on the publishing job is how you get one.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To CREATE the Pages site, not to publish to it. See the step below.
      pages: write
    steps:
      # Turn Pages on if it has never been turned on.
      #
      # tremvok runs `actions/configure-pages` itself, but with no inputs, so it can
      # only READ an existing Pages site. On a repository where Pages was never
      # enabled that read 404s and takes the whole build with it:
      #
      #   Get Pages site failed. Please verify that the repository has Pages enabled
      #   and configured to build using GitHub Actions
      #
      # which is what the first deploy of this migration did. `enablement: true`
      # creates the site with `build_type: workflow` instead, so the prerequisite is
      # provisioned by the workflow that needs it rather than being a setting someone
      # has to remember to click. It is idempotent: once Pages exists this is a no-op,
      # and tremvok's own read then succeeds.
      #
      # This is the only reason the build job carries `pages: write`. Publishing still
      # happens in the deploy job below, which is separate because a composite action
      # cannot declare the `github-pages` environment that `deploy-pages` requires.
      - name: Enable Pages if it is not already
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # Pinned to a commit rather than the floating @v2. A tag is a mutable pointer:
      # whoever can write the repository can move it, so pinning to one means running
      # whatever it names at the time the workflow runs. SonarCloud's security rating
      # gates on this (githubactions:S7637), and it is how tremvok and diatreme pin
      # their own third-party actions. The trade is that patches no longer arrive on
      # their own — bump the SHA and the comment together, or let Dependabot's
      # github-actions ecosystem do it.
      - uses: MagmaMoose/tremvok@1eedaa0def44caead577c1bda94f2c6a3f67428c # v2.7.0
        with:
          target: github-pages
          pages-strict: true

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
