# docs.calebsargeant.com: the MkDocs site, as an assets-only Cloudflare Worker.
#
# Published by MagmaMoose/tremvok's `cloudflare-docs` target (.github/workflows/docs.yml),
# which builds the site strictly, writes llms.txt and llms-full.txt into it, runs
# `wrangler deploy` with this file, and only then publishes the search corpus to R2 for
# mcp.calebsargeant.com. Nothing here is per-page; the whole configuration is this file.
#
# ── ASSETS-ONLY: NO `main`, ON PURPOSE ──────────────────────────────────────
#
# Asset requests are served straight from the edge with no code in the request path, and
# `_headers` (docs/_headers, copied to the site root by MkDocs) stays authoritative:
# custom headers are NOT applied to responses generated by Worker code, so an entrypoint
# would silently strip the CSP from anything it handled. The same reasoning as
# CalebSargeant/website's wrangler.toml.
#
# This is NOT the MagmaMoose fleet shape. Those docs Workers have no route and a `main`,
# because they are reached only through the docs router's service binding on
# docs.magmamoose.com. This one is its own hostname, so it needs neither.

name = "calebsargeant-docs"
compatibility_date = "2026-07-24"

# Pinned so the deploy token never has to discover the account, which needs a USER-scoped
# permission an account token cannot hold. It is the Magma Moose account because that is
# where the calebsargeant.com zone lives. The id is not a credential.
account_id = "6e26afa31c37dee1dc82ad2f214f9b3c"

# Canonical on docs.calebsargeant.com only. workers.dev would be a second copy of every
# page for search engines to rank against the real one.
workers_dev = false

[assets]
# The MkDocs build output. tremvok's `cloudflare-docs` target refuses to publish it empty:
# publishing nothing over a site that is currently serving SUCCEEDS, which is the failure
# worth refusing.
directory = "./site"
# MkDocs emits a 404.html. Served with a real 404 status, not the home page with a 200: a
# soft 404 is penalised by search engines and hides broken links from anyone auditing.
not_found_handling = "404-page"

# A route, NOT a Custom Domain.
#
# docs.calebsargeant.com already has a proxied DNS record (the CNAME GitHub Pages served
# this site from), and Cloudflare refuses to attach a Custom Domain over an existing record.
# A route binds to a hostname that is already proxied and intercepts the request before it
# reaches the origin, so the cutover has no window: the record stays, GitHub Pages is simply
# never asked again, and rolling back is deleting this route. CalebSargeant/website moved
# its apex and www the same way. The `/*` is required: a pattern with no path matches
# nothing.
[[routes]]
pattern = "docs.calebsargeant.com/*"
zone_name = "calebsargeant.com"
